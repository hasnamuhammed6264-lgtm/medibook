{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-12">
    <h3 class="mb-4">Welcome, <span class="text-primary">{{ current_user.full_name }}</span> 👋</h3>
  </div>
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <i class="bi bi-calendar2-plus text-primary" style="font-size:2rem"></i>
      <h5 class="mt-2">Book Appointment</h5>
      <a href="/doctors" class="btn btn-primary mt-2">Find a Doctor</a>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <i class="bi bi-clock-history text-primary" style="font-size:2rem"></i>
      <h5 class="mt-2">My Appointments</h5>
      <a href="/my-appointments" class="btn btn-outline-primary mt-2">View All</a>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <i class="bi bi-person-circle text-primary" style="font-size:2rem"></i>
      <h5 class="mt-2">My Profile</h5>
      <a href="/profile" class="btn btn-outline-primary mt-2">Edit Profile</a>
    </div>
  </div>
</div>
{% endblock %}
