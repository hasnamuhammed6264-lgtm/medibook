name: MediBook CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test app starts correctly
      run: |
        python << 'PYEOF'
        from app import create_app, db
        app = create_app()
        with app.app_context():
            db.create_all()
            print("✅ App created successfully")
            print("✅ Database tables created")
        PYEOF

    - name: Check all routes exist
      run: |
        python << 'PYEOF'
        from app import create_app
        app = create_app()
        rules = [str(rule) for rule in app.url_map.iter_rules()]
        required = ['/', '/login', '/register', '/logout', '/doctors', '/dashboard']
        for route in required:
            if route in rules:
                print(f"✅ Route {route} exists")
            else:
                print(f"❌ Route {route} MISSING")
        PYEOF

  build:
    runs-on: ubuntu-latest
    needs: test
    name: Build Docker Image

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        docker build -t medibook:latest .
        echo "✅ Docker image built successfully"

    - name: Test Docker container
      run: |
        docker run -d --name medibook-test \
          -e SECRET_KEY=test-secret-key \
          -e DATABASE_URL=sqlite:///test.db \
          -p 5000:5000 \
          medibook:latest
        sleep 5
        curl -f http://localhost:5000 || exit 1
        echo "✅ Container is running and responding"
        docker stop medibook-test

  security:
    runs-on: ubuntu-latest
    needs: test
    name: Security Scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security scanner
      run: pip install bandit

    - name: Run security scan
      run: |
        bandit -r app/ -f txt || true
        echo "✅ Security scan completed"
